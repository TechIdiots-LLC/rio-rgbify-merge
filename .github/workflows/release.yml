name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version:   ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version and check GitHub releases
        id: check
        run: |
          # setup.py parses this same assignment, so the package on PyPI and the
          # tag here can never disagree.
          VERSION=$(python -c "
          import re
          src = open('rio_rgbify/__init__.py').read()
          print(re.search(r'''__version__\s*=\s*[\"'](.+?)[\"']''', src).group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          # Every push to master runs this workflow, and most pushes are not
          # releases. The version having already been released is what tells
          # them apart -- so a normal commit finds its tag present and stops
          # here, and the one commit that merged a bump PR does not.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "published=true"  >> "$GITHUB_OUTPUT"
            echo "Already released — skipping build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Not yet released — proceeding."
          fi

  # Reuses the CI matrix rather than restating it. A release that skipped the
  # tests would be a release nobody checked.
  test:
    name: Test
    needs: version-check
    if: needs.version-check.outputs.published == 'false'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: [version-check, test]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # No GDAL needed: this builds the distribution, it does not import the
      # package. rasterio stays a declared dependency that pip resolves on the
      # installing machine.
      - name: Build
        run: python -m build

      - name: Check metadata
        run: |
          twine check dist/*
          ls -la dist/

      # The sdist and wheel must carry the version the tag will use, or the
      # release and PyPI end up describing different builds.
      #
      # Compared as parsed versions rather than as strings, because the two
      # spellings genuinely differ: the bump workflow produces semver, and
      # PEP 440 normalises it on the way into a filename, so a `0.6.0-rc.1`
      # release builds `...-0.6.0rc1-...`. A substring check would pass every
      # final release and fail every prerelease.
      - name: Verify built version matches
        run: |
          python - <<'EOF'
          import pathlib, sys
          from packaging.version import Version
          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          expected = Version("${{ needs.version-check.outputs.version }}")
          files = sorted(pathlib.Path("dist").iterdir())
          if not files:
              sys.exit("::error::dist/ is empty")

          failed = False
          for f in files:
              if f.name.endswith(".whl"):
                  _, found, _, _ = parse_wheel_filename(f.name)
              elif f.name.endswith(".tar.gz"):
                  _, found = parse_sdist_filename(f.name)
              else:
                  continue
              status = "ok" if found == expected else "MISMATCH"
              print(f"  {f.name}: {found} ({status})")
              if found != expected:
                  failed = True

          if failed:
              sys.exit(f"::error::expected {expected}, see mismatches above")
          print(f"All artifacts carry {expected}")
          EOF

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release and PyPI
    runs-on: ubuntu-latest
    needs: [version-check, build]
    if: needs.version-check.outputs.published == 'false'
    environment: release
    permissions:
      contents: write
      # Required for PyPI Trusted Publishing. Harmless when publishing with a
      # token instead.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" \
              'BEGIN{p=0} $0==ver{p=1;next} /^## /&&p{exit} p{print}' \
              CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}." > release-notes.md
          fi

          # An empty section means the bump PR was merged without anyone writing
          # the entries. Better a thin release note than a silently empty one.
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}." > release-notes.md
          fi

          cat release-notes.md

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag:          v${{ needs.version-check.outputs.version }}
          name:         v${{ needs.version-check.outputs.version }}
          bodyFile:     release-notes.md
          artifacts:    "dist/*"
          draft:        false
          # A version carrying a prerelease segment (1.2.3-rc.1) is marked as one
          # on GitHub too, so it does not show as the latest release.
          prerelease:   ${{ contains(needs.version-check.outputs.version, '-') }}
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trusted Publishing: no stored token. PyPI verifies this workflow's OIDC
      # identity against a publisher configured at
      # https://pypi.org/manage/account/publishing/ -- which must name this
      # repository, `release.yml`, and the `release` environment set on this
      # job. All three have to match or the upload is rejected.
      #
      # For a project that does not exist on PyPI yet, add it as a *pending*
      # publisher; the project is created by the first successful upload.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run after a partial failure should not fall over on the file
          # that already landed.
          skip-existing: true
